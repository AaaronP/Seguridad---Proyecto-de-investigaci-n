services:
  victima-vm:
    build:
      context: .
      dockerfile: Dockerfile.victima
    container_name: rollup-victima
    command: node server.js
    ports:
      - "3000:3000"
    networks:
      - rollup-red

  atacante-vm:
    build:
      context: .
      dockerfile: Dockerfile.atacante
    container_name: rollup-atacante
    command: sleep infinity
    networks:
      - rollup-red

networks:
  rollup-red:
    driver: bridge
